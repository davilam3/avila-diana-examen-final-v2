name: ci-cd
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test || true

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t examen-final:latest .
      - run: docker tag examen-final:latest registry/app:${{ github.sha }}
      - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin registry
      - run: docker push registry/app:${{ github.sha }}
      - run: kubectl set image deployment/web-deployment web=registry/app:${{ github.sha }}

